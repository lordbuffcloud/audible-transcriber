<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUDIBLE TRANSCRIBER // DECRYPT & TRANSCRIBE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', 'Lucida Console', monospace;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }
        
        /* Scanline overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }
        
        /* Glitch animation */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        .glitch-text {
            animation: glitch 3s infinite, flicker 0.15s infinite;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-size: 2.5em;
            text-align: center;
            margin: 30px 0;
            text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
            letter-spacing: 3px;
        }
        
        .section {
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #00ff41;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }
        
        .section h2 {
            color: #ff6600;
            margin-bottom: 15px;
            font-size: 1.5em;
            border-bottom: 1px solid #ff6600;
            padding-bottom: 10px;
        }
        
        input, select, button {
            background: #1a1a1a;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin: 5px;
        }
        
        input:focus, select:focus {
            outline: none;
            box-shadow: 0 0 10px #00ff41;
        }
        
        button {
            background: #00ff41;
            color: #0a0a0a;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #ff6600;
            box-shadow: 0 0 20px #ff6600;
        }
        
        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #1a1a1a;
            border: 1px solid #00ff41;
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff41, #ff6600);
            transition: width 0.3s;
            width: 0%;
        }
        
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0a0a0a;
            font-weight: bold;
            z-index: 1;
        }
        
        .book-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #333;
            padding: 10px;
        }
        
        .book-item {
            padding: 10px;
            border-bottom: 1px solid #222;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .book-item:hover {
            background: rgba(0, 255, 65, 0.1);
        }
        
        .book-item.selected {
            background: rgba(255, 102, 0, 0.2);
            border-left: 3px solid #ff6600;
        }
        
        .status {
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid;
        }
        
        .status.success {
            border-color: #00ff41;
            background: rgba(0, 255, 65, 0.1);
        }
        
        .status.error {
            border-color: #ff0000;
            background: rgba(255, 0, 0, 0.1);
            color: #ff0000;
        }
        
        .status.info {
            border-color: #00ffff;
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
        }
        
        #output {
            background: #000;
            border: 1px solid #333;
            padding: 15px;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.5;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="glitch-text">▌ AUDIBLE TRANSCRIBER ▌</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">// DECRYPT & TRANSCRIBE AUDIOBOOKS //</p>
        
        <!-- Auth Section -->
        <div class="section" id="auth-section">
            <h2>⟫ AUTHENTICATION</h2>
            <div id="auth-status"></div>
            <input type="text" id="username" placeholder="Audible Username/Email" style="width: 300px;">
            <input type="password" id="password" placeholder="Password" style="width: 300px;">
            <select id="locale">
                <option value="us">US</option>
                <option value="uk">UK</option>
                <option value="de">DE</option>
                <option value="fr">FR</option>
            </select>
            <button onclick="authenticate()">⟫ CONNECT</button>
        </div>
        
        <!-- Books Section -->
        <div class="section hidden" id="books-section">
            <h2>⟫ LIBRARY</h2>
            <button onclick="loadBooks()">⟫ LOAD BOOKS</button>
            <div class="book-list" id="book-list"></div>
        </div>
        
        <!-- Transcribe Section -->
        <div class="section hidden" id="transcribe-section">
            <h2>⟫ TRANSCRIBE</h2>
            <div>
                <label>Model: </label>
                <select id="model">
                    <option value="tiny">Tiny (fast)</option>
                    <option value="base" selected>Base (balanced)</option>
                    <option value="small">Small (accurate)</option>
                    <option value="medium">Medium (very accurate)</option>
                </select>
                <label> Format: </label>
                <select id="format">
                    <option value="txt">TXT</option>
                    <option value="json">JSON</option>
                </select>
            </div>
            <div style="margin-top: 10px;">
                <strong>Selected ASIN: </strong><span id="selected-asin">None</span>
            </div>
            <button onclick="startTranscription()" id="transcribe-btn">⟫ START TRANSCRIPTION</button>
            
            <div class="progress-bar hidden" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
                <div class="progress-text" id="progress-text">0%</div>
            </div>
            <div id="progress-message"></div>
        </div>
        
        <!-- Output Section -->
        <div class="section hidden" id="output-section">
            <h2>⟫ OUTPUT</h2>
            <div id="output"></div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();
        let selectedAsin = null;
        let isAuthenticated = false;
        
        socket.on('auth_status', function(data) {
            const statusDiv = document.getElementById('auth-status');
            if (data.status === 'success') {
                statusDiv.innerHTML = '<div class="status success">✓ ' + data.message + '</div>';
                isAuthenticated = true;
                document.getElementById('books-section').classList.remove('hidden');
                document.getElementById('transcribe-section').classList.remove('hidden');
            } else {
                statusDiv.innerHTML = '<div class="status error">✗ ' + data.message + '</div>';
            }
        });
        
        socket.on('progress', function(data) {
            const progressBar = document.getElementById('progress-bar');
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');
            const progressMessage = document.getElementById('progress-message');
            
            progressBar.classList.remove('hidden');
            
            if (data.progress === -1) {
                progressMessage.innerHTML = '<div class="status error">' + data.message + '</div>';
            } else if (data.progress === 100) {
                progressFill.style.width = '100%';
                progressText.textContent = '100%';
                progressMessage.innerHTML = '<div class="status success">✓ ' + data.message + '</div>';
                if (data.output) {
                    document.getElementById('output-section').classList.remove('hidden');
                    document.getElementById('output').innerHTML = '<a href="/transcripts/' + data.output.split('/').pop() + '" style="color: #00ff41;">⟫ DOWNLOAD TRANSCRIPT</a>';
                }
            } else {
                progressFill.style.width = data.progress + '%';
                progressText.textContent = data.progress + '%';
                progressMessage.innerHTML = '<div class="status info">' + data.message + '</div>';
            }
        });
        
        function authenticate() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const locale = document.getElementById('locale').value;
            
            if (!username || !password) {
                alert('Username and password required');
                return;
            }
            
            fetch('/auth', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password, locale})
            });
        }
        
        function loadBooks() {
            fetch('/list-books')
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        alert(data.error);
                        return;
                    }
                    const bookList = document.getElementById('book-list');
                    bookList.innerHTML = '';
                    data.books.forEach(book => {
                        const div = document.createElement('div');
                        div.className = 'book-item';
                        div.innerHTML = '<strong>' + book.title + '</strong><br><em>' + book.authors + '</em><br><small>ASIN: ' + book.asin + '</small>';
                        div.onclick = () => selectBook(book.asin, div);
                        bookList.appendChild(div);
                    });
                });
        }
        
        function selectBook(asin, element) {
            document.querySelectorAll('.book-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedAsin = asin;
            document.getElementById('selected-asin').textContent = asin;
        }
        
        function startTranscription() {
            if (!selectedAsin) {
                alert('Select a book first');
                return;
            }
            
            const model = document.getElementById('model').value;
            const format = document.getElementById('format').value;
            
            document.getElementById('transcribe-btn').disabled = true;
            
            fetch('/transcribe', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({asin: selectedAsin, model, format})
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    document.getElementById('transcribe-btn').disabled = false;
                }
            });
        }
    </script>
</body>
</html>
